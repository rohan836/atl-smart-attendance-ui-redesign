name: Apply Attendance UI Redesign

on:
  push:
    branches:
      - feature/attendance-ui-redesign

permissions:
  contents: write

jobs:
  redesign:
    if: ${{ !startsWith(github.event.head_commit.message, 'ui-redesign:') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Attendance controls rail
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path("ATL-Smart-Attendance-Production.html")
          js_path = Path("backend/ui_app.js")

          html = html_path.read_text(encoding="utf-8")
          js = js_path.read_text(encoding="utf-8")

          css_marker = "/* Attendance side settings rail — UI redesign */"
          js_marker = "/* Attendance side settings rail — UI redesign */"

          css = r'''\n\n    /* Attendance side settings rail — UI redesign */
    #pane-attendance {
      position: relative !important;
      overflow: hidden !important;
      min-width: 0 !important;
    }

    #pane-attendance > .attendance-settings {
      position: absolute !important;
      z-index: 8 !important;
      top: 0 !important;
      left: 0 !important;
      bottom: 0 !important;
      width: clamp(270px, 23vw, 320px) !important;
      min-width: 270px !important;
      padding: 24px 20px 28px !important;
      overflow-x: hidden !important;
      overflow-y: auto !important;
      box-sizing: border-box !important;
      background: rgba(242, 243, 246, 0.07) !important;
      border-right: 1px solid rgba(242, 243, 246, 0.14) !important;
      backdrop-filter: blur(22px) saturate(1.2) !important;
      -webkit-backdrop-filter: blur(22px) saturate(1.2) !important;
      transform: translateX(-102%) !important;
      transition: transform 340ms var(--ease) !important;
      scrollbar-width: thin !important;
      scrollbar-color: rgba(242, 243, 246, 0.18) transparent !important;
    }

    #pane-attendance:not(.hidden) > .attendance-settings {
      transform: translateX(0) !important;
    }

    #pane-attendance > .attendance-settings::-webkit-scrollbar {
      width: 3px !important;
    }

    #pane-attendance > .attendance-settings::-webkit-scrollbar-track {
      background: transparent !important;
    }

    #pane-attendance > .attendance-settings::-webkit-scrollbar-thumb {
      background: rgba(242, 243, 246, 0.18) !important;
      border-radius: 2px !important;
    }

    #pane-attendance > .attendance-settings .attendance-settings-head {
      padding-bottom: 16px !important;
      margin-bottom: 16px !important;
      border-bottom: 1px solid rgba(242, 243, 246, 0.12) !important;
    }

    #pane-attendance > .attendance-settings .attendance-settings-title {
      font-family: var(--sans) !important;
      font-size: 11px !important;
      font-weight: 500 !important;
      letter-spacing: 0.06em !important;
      text-transform: uppercase !important;
      color: #F2F3F6 !important;
    }

    #pane-attendance > .attendance-settings .attendance-settings-sub {
      margin-top: 4px !important;
      font-family: var(--sans) !important;
      font-size: 10.5px !important;
      font-weight: 400 !important;
      color: rgba(242, 243, 246, 0.45) !important;
      line-height: 1.45 !important;
    }

    #pane-attendance > .attendance-settings .attendance-settings-body {
      display: flex !important;
      flex-direction: column !important;
      gap: 14px !important;
      min-width: 0 !important;
    }

    /* The old Attendance toolbar stays in the DOM for compatibility, but
       disappears completely from the visual workspace. */
    #pane-attendance > .tab-toolbar {
      display: none !important;
    }

    /* Keep the data workspace clear of the new left rail. */
    #pane-attendance:not(.hidden) > .detail-scroll {
      padding-left: calc(clamp(270px, 23vw, 320px) + clamp(16px, 3vw, 32px)) !important;
    }

    /* Date preset strip becomes the primary left-side control surface. */
    #pane-attendance > .attendance-settings .seg-strip {
      display: flex !important;
      flex-direction: column !important;
      align-items: stretch !important;
      gap: 2px !important;
      width: 100% !important;
      background: transparent !important;
      border: 0 !important;
    }

    #pane-attendance > .attendance-settings .seg-btn {
      display: flex !important;
      align-items: center !important;
      min-height: 34px !important;
      width: 100% !important;
      padding: 6px 8px !important;
      border: 0 !important;
      border-radius: 3px !important;
      background: transparent !important;
      color: rgba(242, 243, 246, 0.65) !important;
      font-family: var(--sans) !important;
      font-size: 11px !important;
      font-weight: 400 !important;
      letter-spacing: 0.01em !important;
      text-align: left !important;
      justify-content: flex-start !important;
      box-shadow: none !important;
      transition: background 140ms ease, color 140ms ease !important;
    }

    #pane-attendance > .attendance-settings .seg-btn:hover {
      background: rgba(242, 243, 246, 0.06) !important;
      color: #F2F3F6 !important;
    }

    #pane-attendance > .attendance-settings .seg-btn.active {
      background: rgba(242, 243, 246, 0.12) !important;
      color: #F2F3F6 !important;
      font-weight: 500 !important;
    }

    #pane-attendance > .attendance-settings .seg-sep {
      width: 100% !important;
      height: 1px !important;
      margin: 8px 0 !important;
      background: rgba(242, 243, 246, 0.1) !important;
      opacity: 1 !important;
    }

    #pane-attendance > .attendance-settings #attDatePreset {
      display: none !important;
    }

    #pane-attendance > .attendance-settings #attSingleDate,
    #pane-attendance > .attendance-settings #attFromDate,
    #pane-attendance > .attendance-settings #attToDate {
      width: 100% !important;
      height: 32px !important;
      padding: 4px 0 !important;
      background: transparent !important;
      border: 0 !important;
      border-bottom: 1px solid rgba(242, 243, 246, 0.2) !important;
      border-radius: 0 !important;
      color: #F2F3F6 !important;
      font-family: var(--mono) !important;
      font-size: 11px !important;
      outline: none !important;
      box-sizing: border-box !important;
      color-scheme: light !important;
    }

    #pane-attendance > .attendance-settings #attSingleDate:focus,
    #pane-attendance > .attendance-settings #attFromDate:focus,
    #pane-attendance > .attendance-settings #attToDate:focus {
      border-bottom-color: #F2F3F6 !important;
    }

    #pane-attendance > .attendance-settings #attApplyBtn {
      align-self: flex-start !important;
      margin-top: 2px !important;
      padding: 5px 8px !important;
      border: 1px solid rgba(242, 243, 246, 0.25) !important;
      border-radius: 3px !important;
      background: rgba(242, 243, 246, 0.08) !important;
      color: #F2F3F6 !important;
      font-family: var(--sans) !important;
      font-size: 10px !important;
      font-weight: 500 !important;
      letter-spacing: 0.05em !important;
      text-transform: uppercase !important;
      text-decoration: none !important;
      height: auto !important;
      cursor: pointer !important;
    }

    #pane-attendance > .attendance-settings #attApplyBtn:hover {
      background: rgba(242, 243, 246, 0.14) !important;
      border-color: rgba(242, 243, 246, 0.45) !important;
    }

    /* Dark-ink mirror. */
    html[data-ink="dark"] #pane-attendance > .attendance-settings {
      background: rgba(24, 26, 32, 0.07) !important;
      border-right-color: rgba(24, 26, 32, 0.14) !important;
      scrollbar-color: rgba(24, 26, 32, 0.18) transparent !important;
    }

    html[data-ink="dark"] #pane-attendance > .attendance-settings .attendance-settings-head {
      border-bottom-color: rgba(24, 26, 32, 0.12) !important;
    }

    html[data-ink="dark"] #pane-attendance > .attendance-settings .attendance-settings-title {
      color: #181A20 !important;
    }

    html[data-ink="dark"] #pane-attendance > .attendance-settings .attendance-settings-sub {
      color: rgba(24, 26, 32, 0.45) !important;
    }

    html[data-ink="dark"] #pane-attendance > .attendance-settings .seg-btn {
      color: rgba(24, 26, 32, 0.65) !important;
    }

    html[data-ink="dark"] #pane-attendance > .attendance-settings .seg-btn:hover {
      background: rgba(24, 26, 32, 0.06) !important;
      color: #181A20 !important;
    }

    html[data-ink="dark"] #pane-attendance > .attendance-settings .seg-btn.active {
      background: rgba(24, 26, 32, 0.12) !important;
      color: #181A20 !important;
    }

    html[data-ink="dark"] #pane-attendance > .attendance-settings .seg-sep {
      background: rgba(24, 26, 32, 0.1) !important;
    }

    html[data-ink="dark"] #pane-attendance > .attendance-settings #attSingleDate,
    html[data-ink="dark"] #pane-attendance > .attendance-settings #attFromDate,
    html[data-ink="dark"] #pane-attendance > .attendance-settings #attToDate {
      color: #181A20 !important;
      border-bottom-color: rgba(24, 26, 32, 0.2) !important;
      color-scheme: light !important;
    }

    html[data-ink="dark"] #pane-attendance > .attendance-settings #attSingleDate:focus,
    html[data-ink="dark"] #pane-attendance > .attendance-settings #attFromDate:focus,
    html[data-ink="dark"] #pane-attendance > .attendance-settings #attToDate:focus {
      border-bottom-color: #181A20 !important;
    }

    html[data-ink="dark"] #pane-attendance > .attendance-settings #attApplyBtn {
      border-color: rgba(24, 26, 32, 0.25) !important;
      background: rgba(24, 26, 32, 0.08) !important;
      color: #181A20 !important;
    }

    @media (prefers-reduced-motion: reduce) {
      #pane-attendance > .attendance-settings {
        transition: none !important;
        transform: translateX(0) !important;
      }
    }
'''

          if css_marker not in html:
              needle = "\n  </style>"
              idx = html.rfind(needle)
              if idx == -1:
                  raise SystemExit("Could not locate closing style tag")
              html = html[:idx] + css + html[idx:]

          js_patch = r'''\n\n/* Attendance side settings rail — UI redesign */
(function () {
  function mountAttendanceSettingsRail() {
    var pane = document.getElementById("pane-attendance");
    var toolbar = pane && pane.querySelector(":scope > .tab-toolbar");
    if (!pane || !toolbar) return;

    var rail = document.getElementById("attendanceSettings");
    if (!rail) {
      rail = document.createElement("aside");
      rail.id = "attendanceSettings";
      rail.className = "attendance-settings";
      rail.setAttribute("aria-label", "Attendance controls");
      rail.innerHTML = ''
        + '<div class="attendance-settings-head">'
        + '  <div class="attendance-settings-title">Attendance Controls</div>'
        + '  <div class="attendance-settings-sub">Choose the attendance date scope.</div>'
        + '</div>'
        + '<div class="attendance-settings-body" id="attendanceSettingsBody"></div>';
      pane.insertBefore(rail, pane.firstChild);
    }

    var body = document.getElementById("attendanceSettingsBody");
    if (!body) return;

    var selectors = [
      ".seg-strip",
      "#attDatePreset",
      "#attSingleDate",
      "#attFromDate",
      "#attToDate",
      "#attApplyBtn"
    ];

    selectors.forEach(function (selector) {
      var node = toolbar.querySelector(selector);
      if (node) body.appendChild(node);
    });

    var singleDate = document.getElementById("attSingleDate");
    var fromDate = document.getElementById("attFromDate");
    var toDate = document.getElementById("attToDate");
    var apply = document.getElementById("attApplyBtn");

    if (singleDate && fromDate && toDate) {
      if (!singleDate.dataset.railWrapped) singleDate.dataset.railWrapped = "1";
      if (!fromDate.dataset.railWrapped) fromDate.dataset.railWrapped = "1";
      if (!toDate.dataset.railWrapped) toDate.dataset.railWrapped = "1";
    }
    if (apply) apply.dataset.railMounted = "1";

    body.querySelectorAll("#attSingleDate, #attFromDate, #attToDate").forEach(function (input) {
      input.setAttribute("aria-label", input.id === "attSingleDate" ? "Attendance date" : input.id === "attFromDate" ? "Attendance range start" : "Attendance range end");
    });
  }

  function start() {
    mountAttendanceSettingsRail();
    window.setTimeout(mountAttendanceSettingsRail, 0);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start, { once: true });
  } else {
    window.setTimeout(start, 0);
  }
})();
'''

          if js_marker not in js:
              js = js.rstrip() + js_patch + "\n"

          html_path.write_text(html, encoding="utf-8", newline="\n")
          js_path.write_text(js, encoding="utf-8", newline="\n")

          # Validate the expected redesign anchors before committing.
          final_html = html_path.read_text(encoding="utf-8")
          final_js = js_path.read_text(encoding="utf-8")
          required_html = [
              "#pane-attendance > .attendance-settings",
              "#pane-attendance > .tab-toolbar",
              "#pane-attendance:not(.hidden) > .detail-scroll",
          ]
          required_js = [
              "id = \"attendanceSettings\"",
              "\"#attDatePreset\"",
              "\"#attApplyBtn\"",
          ]
          for needle in required_html:
              if needle not in final_html:
                  raise SystemExit(f"Missing HTML validation anchor: {needle}")
          for needle in required_js:
              if needle not in final_js:
                  raise SystemExit(f"Missing JS validation anchor: {needle}")
          PY

      - name: Commit redesign
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ATL-Smart-Attendance-Production.html backend/ui_app.js .github/workflows/apply-attendance-ui-redesign.yml
          git rm .github/workflows/apply-attendance-ui-redesign.yml
          git commit -m "ui-redesign: move attendance controls to left rail"
          git push origin HEAD:feature/attendance-ui-redesign
